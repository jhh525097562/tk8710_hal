# TurMass Link Gateway Daemon 配置文件
# 修改后将在下一次扫描周期自动热加载生效

[process]
# 需守护的关键进程列表，支持配置多个 proc �?
# 守护逻辑：周期检查进程是否存在，若退出则自动重启
# 格式：proc=可执行文件的绝对路径
proc=/usr/bin/log_daemon 5514 /userdata/logs 262144 1000 10485760 20
proc=/userdata/mqtt_bridge
proc=/userdata/web_server
proc=/userdata/tk8710_gw
[network]
# L3 连通性检测目�?IP 列表
# 建议配置多个公网高可�?IP（如 DNS 服务器），用逗号分隔
# 只要任一目标可达，即认为当前链路可用
targets=223.5.5.5,119.29.29.29,180.76.76.76

# 手动禁用的网络接口列�?
# 被禁用的接口将直接跳过，不参与选路。用逗号分隔（如 wlan0,usb0�?
disabled=

# 网络检测循环间隔（秒）
# 每隔多少秒执行一次网络质量探�?
check_interval=10

# 连续失败判定阈�?
# 连续多少次探测不达标（丢包或延迟过高）后，判定当前链路失效并触发切换
fail_threshold=3

# 丢包率阈值（%�?
# Ping 探测丢包率超过此值时，视为链路质量不达标
loss_threshold=5

# 延迟阈值（毫秒�?
# Ping 平均延迟超过此值时，视为链路质量不达标
latency_threshold_ms=1000

# 单次探测发�?Ping 包数�?
# 每次检测发送的数据包个数，用于计算丢包率和平均延迟
ping_count=5

# �?DNS 服务�?
# 网络切换成功后，写入 resolv.conf 的第一�?nameserver
dns_primary=223.5.5.5

# 备用 DNS 服务�?
# 网络切换成功后，写入 resolv.conf 的第二条 nameserver
dns_secondary=180.76.76.76

# 系统 DNS 配置文件路径
# 默认�?/etc/resolv.conf
resolv_conf=/etc/resolv.conf

# 默认路由 Metric �?
# 添加默认路由时指定的 metric 优先级�?
route_metric=10

# 链路恢复层级阈值
recovery_light_threshold=1
recovery_soft_threshold=2
recovery_gpio_cooldown_s=100

# 4G reset GPIO
modem_reset_chip=/dev/gpiochip0
modem_reset_line=19
modem_reset_active_value=1
modem_reset_pulse_ms=1000

# 4G power GPIO
modem_power_chip=/dev/gpiochip0
modem_power_line=20
# 1=开机，0=关机
modem_power_active_value=1
modem_power_off_hold_ms=3000
modem_power_on_wait_s=15
modem_enum_wait_s=20

[daemon]
# 进程守护扫描间隔（秒�?
# 每隔多少秒检查一�?[process] 列表中进程的运行状�?
scan_interval=30

# 进程重启超时时间（秒�?
# 尝试重启进程后，等待进程恢复运行的最长等待时�?
restart_timeout=3

# wlan0 AP 模式最大保持时间（秒）
# 到达该时长后，进入“有客户端则继续保留、无客户端则关闭AP”的判定流程
ap_max_up_time=120

# 连续无网络自动重启超时（秒）
# 连续未达到 NETWORK_READY 的时长达到该值后重启设备，1200=20分钟，0=禁用
no_ready_reboot_timeout=1200

# 日志级别
# 可选值：DEBUG, INFO, WARN, ERROR
log_level=INFO

# 守护进程 PID 文件路径
# 用于防止重复启动�?init 脚本管理
pid_file=/var/run/tdaemon_job.pid

# 守护进程日志文件路径
# 记录运行状态、切换事件及错误信息
log_file=/root/daemon_guard.log
