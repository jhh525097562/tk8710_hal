<div class="status-card status-card--network">
  <div class="status-card-header">IPv4 WAN状态</div>
  <div class="status-card-body">
    <div class="status-kv-row"><div class="status-kv-label">协议</div><div class="status-kv-value">%s</div></div>
    <div class="status-kv-row"><div class="status-kv-label">活跃接口</div><div class="status-kv-value" id="active-iface">-</div></div>
    <div class="status-kv-row"><div class="status-kv-label">IPv4</div><div class="status-kv-value" id="active-ipv4">-</div></div>
    <div class="status-kv-row"><div class="status-kv-label">IPv6</div><div class="status-kv-value" id="active-ipv6">-</div></div>
    <div class="status-kv-row"><div class="status-kv-label">网关</div><div class="status-kv-value" id="active-gateway">-</div></div>
  </div>
</div>
<script>
(function(){
  var timerId = null;
  var inFlight = false;
  var stopped = false;

  function fetchJsonWithTimeout(url, timeoutMs) {
    if (typeof AbortController === 'undefined') {
      return fetch(url).then(function(r){ return r.json(); });
    }
    var controller = new AbortController();
    var timeoutId = setTimeout(function(){ controller.abort(); }, timeoutMs);
    return fetch(url, { signal: controller.signal }).then(function(r){ return r.json(); }).finally(function(){
      clearTimeout(timeoutId);
    });
  }

  function scheduleNext(delayMs){
    if (timerId) clearTimeout(timerId);
    timerId = setTimeout(updateActiveIp, delayMs);
  }

  function fillFallback(){
    var iface = document.getElementById('active-iface');
    var v4 = document.getElementById('active-ipv4');
    var v6 = document.getElementById('active-ipv6');
    var gw = document.getElementById('active-gateway');
    if (iface) iface.innerText = '-';
    if (v4) v4.innerText = '-';
    if (v6) v6.innerText = '-';
    if (gw) gw.innerText = '-';
  }

  function finishCycle(){
    inFlight = false;
    if (stopped || document.hidden) return;
    scheduleNext(3000);
  }

  function updateActiveIp(){
    if (stopped || document.hidden) return;
    if (inFlight) {
      scheduleNext(500);
      return;
    }
    inFlight = true;
    fetchJsonWithTimeout('/api/active_ip', 2500).then(function(res){
      var iface = document.getElementById('active-iface');
      var v4 = document.getElementById('active-ipv4');
      var v6 = document.getElementById('active-ipv6');
      var gw = document.getElementById('active-gateway');
      if (iface) iface.innerText = res.iface || '-';
      if (v4) v4.innerText = res.ipv4 || '-';
      if (v6) v6.innerText = res.ipv6 || '-';
      if (gw) gw.innerText = res.gateway || '-';
      finishCycle();
    }).catch(function(){
      fillFallback();
      finishCycle();
    });
  }

  window.addEventListener('pagehide', function(){
    stopped = true;
    if (timerId) {
      clearTimeout(timerId);
      timerId = null;
    }
  });

  document.addEventListener('visibilitychange', function() {
    if (document.hidden) {
      if (timerId) {
        clearTimeout(timerId);
        timerId = null;
      }
      return;
    }
    if (!stopped && !inFlight) scheduleNext(100);
  });

  updateActiveIp();
})();
</script>
