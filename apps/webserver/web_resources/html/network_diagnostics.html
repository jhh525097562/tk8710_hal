<div class="panel"><div class="panel-header">网络诊断</div><div class="panel-body"><form method="post" action="/network" onsubmit="var btn=document.getElementById('network-ping-btn');if(btn){btn.disabled=true;btn.innerText='Ping中...';}"><div class="form-group"><label class="form-label">目标 IP/域名</label><input class="form-input" name="ping_target" value="%s"></div><div class="form-group"><label class="form-label"></label><button id="network-ping-btn" type="submit" class="btn">Ping</button></div><div class="form-group" style="align-items:flex-start;"><label class="form-label">测试结果</label><textarea class="form-input" style="width:100%%;max-width:100%%;height:360px;white-space:pre;overflow:auto;font-family:monospace;">%s</textarea></div></form></div></div><script>function toggleProto(val) {  var isDhcp = (val === 'dhcp');  document.getElementById('ip').disabled = isDhcp;  document.getElementById('mask').disabled = isDhcp;  document.getElementById('gateway').disabled = isDhcp;}toggleProto(document.getElementById('proto_select').value);</script>
