<div class="panel"><div class="panel-header">MQTT 配置</div><div class="panel-body"><div id="config-save-notice" class="alert alert-success config-save-notice" style="display:%s;">保存成功，请重启设备</div><form method="post" action="/config"><div class="form-group"><label class="form-label">MQTT Host</label><input class="form-input" name="mqtt_host" value="%s"></div><div class="form-group"><label class="form-label">MQTT Port</label><input class="form-input" name="mqtt_port" value="%d"></div><div class="form-group"><label class="form-label">Username</label><input class="form-input" name="username" value="%s"></div><div class="form-group"><label class="form-label">Password</label><input class="form-input" name="password" type="password" value="%s"></div><div class="form-group"><label class="form-label">Gateway ID</label><input class="form-input" name="gateway_id" value="%s"></div><div class="form-group"><label class="form-label">Pub Topic</label><input class="form-input" name="pub_topic" value="%s"></div><div class="form-group"><label class="form-label">Sub Topic</label><input class="form-input" name="sub_topic" value="%s"></div><div class="form-group"><label class="form-label">Heartbeat (s)</label><input class="form-input" name="heartbeat_interval" value="%d"></div><div class="form-group"><label class="form-label">QoS</label><input class="form-input" name="qos" value="%d"></div><div class="form-group"><label class="form-label">Network Interface</label><div style="flex:1;max-width:300px;display:flex;align-items:center;gap:16px;"><label style="display:flex;align-items:center;gap:6px;"><input type="checkbox" name="net_eth" value="ETH" %s>ETH</label><label style="display:flex;align-items:center;gap:6px;"><input type="checkbox" name="net_wifi" value="WiFi" %s>WiFi</label><label style="display:flex;align-items:center;gap:6px;"><input type="checkbox" name="net_4g" value="4G" %s>4G</label></div></div><div class="form-group"><label class="form-label">Antenna</label><select class="form-input" name="antenna_count"><option value="1" %s>1</option><option value="2" %s>2</option><option value="3" %s>3</option><option value="4" %s>4</option><option value="5" %s>5</option><option value="6" %s>6</option><option value="7" %s>7</option><option value="8" %s>8</option></select></div><div class="form-group"><label class="form-label"></label><button type="submit" class="btn">保存配置</button></div></form></div></div><script>setTimeout(function(){var el=document.getElementById('config-save-notice');if(el&&el.style.display!=='none'){el.style.display='none';}},5000);</script>
