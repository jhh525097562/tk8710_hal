<div class="status-card status-card--system"><div class="status-card-header">系统信息</div><div class="status-card-body"><div class="status-kv-row"><div class="status-kv-label">主机名</div><div class="status-kv-value" id="sys-hostname">%s</div></div><div class="status-kv-row"><div class="status-kv-label">型号</div><div class="status-kv-value" id="sys-model">%s</div></div><div class="status-kv-row"><div class="status-kv-label">架构</div><div class="status-kv-value" id="sys-arch">%s</div></div><div class="status-kv-row"><div class="status-kv-label">设备坐标</div><div class="status-kv-value" id="sys-coords" style="overflow-wrap:anywhere;word-break:break-word;">%s</div></div><div class="status-kv-row"><div class="status-kv-label">通信软件版本</div><div class="status-kv-value" id="sys-firmware">%s</div></div><div class="status-kv-row"><div class="status-kv-label">内核版本</div><div class="status-kv-value" id="sys-kernel">%s</div></div><div class="status-kv-row"><div class="status-kv-label">本地时间</div><div class="status-kv-value" id="sys-time">%s</div></div><div class="status-kv-row"><div class="status-kv-label">系统运行时长</div><div class="status-kv-value" id="sys-uptime">%s</div></div><div class="status-kv-row"><div class="status-kv-label">平均负载</div><div class="status-kv-value" id="sys-load">%.2f, %.2f, %.2f</div></div><div class="status-kv-row"><div class="status-kv-label">Web管理版本</div><div class="status-kv-value" id="sys-app">%s</div></div></div></div>
